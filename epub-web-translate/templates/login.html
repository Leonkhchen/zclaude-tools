<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 — EPUB 翻譯轉換器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-slate-700 mb-2 text-center">EPUB 翻譯轉換器</h1>
    <p class="text-slate-400 text-sm text-center mb-6">請輸入存取密碼</p>

    {% if error %}
    <p class="text-red-500 text-sm text-center mb-4 bg-red-50 rounded-lg p-2">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
      <input type="password" name="password" placeholder="密碼"
             autofocus required
             class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm
                    focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mb-4" />
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium
                     rounded-lg py-2.5 text-sm transition-colors">
        登入
      </button>
    </form>
  </div>
</body>
</html>
