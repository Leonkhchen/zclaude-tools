<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>墨評 — 手寫詩句辨識與批改</title>
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><span class="mark">墨</span><h1>墨評</h1></div>
      <p class="tagline">拍照上傳手寫詩句，自動辨識、比對批改</p>
    </header>

    <section class="panel settings-panel">
      <div class="panel-head">
        <h2>Colab 辨識服務設定</h2>
        <span class="badge" id="connBadge">尚未連線</span>
      </div>
      <div class="settings-row">
        <label class="field-label" for="endpointInput">Colab 端點網址</label>
        <div class="input-row">
          <input type="text" id="endpointInput" placeholder="例如 https://xxxx.ngrok-free.app" />
          <button class="btn" id="connectBtn">連線</button>
        </div>
      </div>
      <div class="settings-row">
        <label class="field-label" for="modelSelect">使用中的模型</label>
        <div class="input-row">
          <select id="modelSelect" disabled>
            <option>連線後才能選擇</option>
          </select>
          <button class="btn" id="switchModelBtn" disabled>套用</button>
        </div>
        <p class="hint" id="settingsHint">先填入 Colab 端點並按「連線」，就能看到目前可用的模型清單。切換模型第一次會花時間載入權重。</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>1・選擇要默寫的詩句</h2></div>
      <div class="poem-grid" id="poemGrid">
        <p class="hint">載入詩句清單中…</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>2・上傳手寫照片</h2></div>
      <label class="drop" id="dropZone">
        <span class="icon">📷</span>
        <span id="dropText">點擊拍照或從相簿選取</span>
        <input type="file" id="fileInput" accept="image/*" capture="environment" />
      </label>
      <img id="previewImg" class="preview-img" style="display:none" alt="上傳的照片預覽" />
      <div class="action-row">
        <button class="btn primary" id="processBtn" disabled>開始辨識與批改</button>
      </div>
      <p class="hint" id="processHint"></p>
    </section>

    <section class="panel result-panel" id="resultPanel" style="display:none">
      <div class="panel-head">
        <h2>3・批改結果</h2>
        <span class="badge accuracy" id="accuracyBadge">—</span>
      </div>
      <div class="result-meta" id="resultMeta"></div>
      <div class="diff-box" id="diffBox"></div>
      <div class="action-row">
        <button class="btn" id="exportBtn">匯出結果（存到 Google Drive）</button>
      </div>
      <p class="hint" id="exportHint"></p>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
